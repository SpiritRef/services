<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex,nofollow">
    <title>金祥雲樣式展示 | 鬼磕頭</title>
    <link rel="stylesheet" href="CSS/cloud.css">
    <style>
        body {
            font-family: "PingFang TC", "Microsoft JhengHei", sans-serif;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            max-width: 800px;
            width: 90%;
            background: rgba(255, 255, 255, 0.95);
            padding: 50px 30px;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.06);
            text-align: center;
            backdrop-filter: blur(10px);
            z-index: 1;
            box-sizing: border-box;
            border: 1px solid rgba(212, 175, 55, 0.1);
            position: relative;
        }

        h1 { color: #2c3e50; border-bottom: 2px solid #d4af37; display: inline-block; padding-bottom: 10px; margin-top: 0; }
        p { color: #333; font-size: 1.1rem; line-height: 1.8; }

        .preview-hint { margin-top: 30px; color: #999; font-size: 0.9rem; font-style: italic; }
    </style>
</head>
<body class="cloud-bg">

    <div id="cloud-container" data-count="16"></div>

    <div class="container">
        <h1>金祥雲效果</h1>
        <p>
            請觀察背景的祥雲。<br>
            <b>圖片素材直用</b>，大小、透明度、方向隨機，<br>
            緩緩漂移。
        </p>
        <div class="preview-hint">16 朵，造型取自 /pic/ 圖片。</div>
    </div>

    <script src="Javascript/cloud.js"></script>
</body>
</html>
